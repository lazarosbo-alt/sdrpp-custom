name: Build FM Deviation Meter

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install vcpkg dependencies
        run: |
          vcpkg install glfw3:x64-windows glew:x64-windows fftw3:x64-windows volk:x64-windows zstd:x64-windows

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_CXX_FLAGS="/I C:/vcpkg/installed/x64-windows/include" -DCMAKE_C_FLAGS="/I C:/vcpkg/installed/x64-windows/include" -DOPT_BUILD_FM_DEVIATION_METER=ON
          cmake --build . --config Release --target fm_deviation_meter

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm_deviation_meter_dll
          path: build/**/fm_deviation_meter.dll
