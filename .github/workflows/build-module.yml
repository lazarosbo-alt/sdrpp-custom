name: Build FM Deviation Meter

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install vcpkg dependencies
        run: |
          vcpkg install glfw3:x64-windows glew:x64-windows fftw3:x64-windows volk:x64-windows zstd:x64-windows

      - name: Force Fix Volk Headers
        shell: pwsh
        run: |
          # Αντιγραφή του φακέλου volk απευθείας μέσα στον πηγαίο κώδικα του core
          Copy-Item -Path "C:\vcpkg\installed\x64-windows\include\volk" -Destination "core\src\volk" -Recurse -Force
          # Δημιουργία ψεύτικου PothosSDR για να μην παραπονιέται το CMake του SDR++
          New-Item -ItemType Directory -Force -Path "C:\Program Files\PothosSDR\include\volk"
          Copy-Item -Path "C:\vcpkg\installed\x64-windows\include\volk\*" -Destination "C:\Program Files\PothosSDR\include\volk\" -Recurse -Force

      - name: Configure and Build
        shell: pwsh
        run: |
          $env:INCLUDE = "C:\vcpkg\installed\x64-windows\include;" + $env:INCLUDE
          $env:LIB = "C:\vcpkg\installed\x64-windows\lib;" + $env:LIB
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DOPT_BUILD_FM_DEVIATION_METER=ON
          cmake --build . --config Release --target fm_deviation_meter

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm_deviation_meter_dll
          path: build/**/fm_deviation_meter.dll
